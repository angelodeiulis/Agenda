<style>
:root{--bg:#f5f4f0;--panel:#fff;--ink:#1f1d1a;--muted:#8a8578;--accent:#b5502e;--soft:#f0ded4;--line:#e4e1d8;--cantiere:#4a6b5a;--permesso:#8a6d3b;--ferie:#3b6b8a;--malattia:#8a3b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#242220;--ink:#eee;--muted:#9a958a;--soft:#3a2a22;--line:#37342f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--panel:#242220;--ink:#eee;--muted:#9a958a;--soft:#3a2a22;--line:#37342f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.15rem;margin:0}
.nav{display:flex;gap:6px;align-items:center}
.nav button{border:none;background:var(--panel);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:1rem;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#monthLabel{font-weight:600;min-width:120px;text-align:center;text-transform:capitalize}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}.toolbar button{min-width:30%}#cloud{padding:0 20px 8px;font-size:.75rem;opacity:.7}
.toolbar button{flex:1;padding:10px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:.85rem}
.toolbar button.sec{background:var(--panel);color:var(--accent);border:1px solid var(--soft)}
.calendar{padding:0 12px 40px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 8px}
.wd{padding-bottom:6px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.day{background:var(--panel);border-radius:10px;min-height:64px;padding:6px 5px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.day.out{opacity:.35}.day.today{outline:2px solid var(--accent)}
.num{font-size:.75rem;font-weight:600;color:var(--muted)}.today .num{color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.badge{width:7px;height:7px;border-radius:50%}
.badge.cantiere{background:var(--cantiere)}.badge.permesso{background:var(--permesso)}.badge.ferie{background:var(--ferie)}.badge.malattia{background:var(--malattia)}
.hours{font-size:.62rem;color:var(--muted);margin-top:3px}
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;align-items:flex-end;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--panel);width:100%;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:1.05rem;text-transform:capitalize}
.sub{color:var(--muted);font-size:.8rem;margin-bottom:14px}
.types{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:.78rem;font-weight:600;color:var(--muted)}
.chip.active{color:#fff;border-color:transparent}
.chip.active[data-type=cantiere]{background:var(--cantiere)}.chip.active[data-type=permesso]{background:var(--permesso)}.chip.active[data-type=ferie]{background:var(--ferie)}.chip.active[data-type=malattia]{background:var(--malattia)}
label{display:block;font-size:.75rem;color:var(--muted);font-weight:600;margin:12px 0 5px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font:inherit;font-size:.9rem;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:.82rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .d{color:var(--muted)}
.item .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.item .del{background:none;border:none;color:var(--malattia);font-size:1.1rem;line-height:1}
.item .ed{background:none;border:none;color:var(--accent);font-size:1.15rem;line-height:1}
.item .rap{border:1px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:8px;padding:6px 9px;font-weight:600;font-size:.78rem;white-space:nowrap}
.item .rap.ok{background:var(--accent);color:#fff}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:600;font-size:.85rem}
.save{background:var(--accent);color:#fff}.cancel{background:var(--bg);color:var(--muted)}
#rapov{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#rapov.open{display:flex}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.rbar button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.rbar span{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rapfr{flex:1;border:0;width:100%;background:var(--bg)}
#msg{display:none;padding:10px 12px;background:var(--soft);font-size:.85rem;border-top:1px solid var(--line)}
#msg a{display:inline-block;margin-top:6px;background:#25d366;color:#000;border-radius:10px;padding:9px 14px;font-weight:700;text-decoration:none}
#cf.perm>label,#cf.perm>input,#cf.perm>textarea,#cf.perm .row2>div:nth-child(2){display:none}
@media print{header,.toolbar,.overlay,#rapov{display:none!important}body{background:#fff}.day{box-shadow:none;border:1px solid #ccc}}
</style></head><body>
<header><h1>📆 Agenda</h1><div class="nav"><button id="prev">‹</button><span id="monthLabel"></span><button id="next">›</button></div></header>
<div class="toolbar"><button class="sec" id="todayBtn">Oggi</button><button id="printBtn">🖨️ Stampa</button><button id="xlsBtn">📄 Foglio presenze</button><button class="sec" id="jsBtn">💾 Salva JSON</button><button class="sec" id="jlBtn">📂 Carica JSON</button></div><div id="cloud"></div><input type="file" id="jf" accept=".json,application/json" hidden>
<div class="calendar"><div class="wd"><div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div></div><div class="grid" id="grid"></div></div>

<div class="overlay" id="overlay"><div class="sheet">
<h2 id="sheetDate">—</h2><div class="sub">Voci del giorno</div>
<div class="item-list" id="list"></div>
<div class="sub" style="margin-top:16px">Aggiungi una voce</div>
<div class="types" id="types"><div class="chip" data-type="cantiere">Cantiere / intervento</div><div class="chip" data-type="permesso">Permesso</div><div class="chip" data-type="ferie">Ferie</div><div class="chip" data-type="malattia">Malattia</div></div>
<div id="cf"><label>Cliente / cantiere</label><input type="text" id="cliente" placeholder="es. Rossi S.r.l.">
<div class="row2"><div><label>Ore lavoro</label><input type="text" id="oreL" inputmode="decimal" placeholder="es. 8"></div><div><label>Ore viaggio</label><input type="text" id="oreV" inputmode="decimal" placeholder="es. 1"></div></div>
<label>N. tecnici</label><input type="text" id="nTec" inputmode="numeric" placeholder="es. 2">
<label>Note / lavorazioni / materiali</label><textarea id="note"></textarea></div>
<div class="acts"><button class="cancel" id="closeBtn">Chiudi</button><button class="save" id="addBtn">Aggiungi voce</button></div>
</div></div>

<div id="rapov"><div class="rbar"><button id="rapBack">‹ Agenda</button><button id="rapWa" style="background:#25d366;color:#000">📲 WhatsApp</button><span id="rapTit"></span></div><div id="msg"></div><iframe id="rapfr" title="Rapportino" allow="web-share; clipboard-write"></iframe></div>

  const r=doc.createElementNS(W,'w:r'),pr=doc.createElementNS(W,'w:rPr'),f=doc.createElementNS(W,'w:rFonts');
  ['ascii','cs','eastAsia','hAnsi'].forEach(a=>f.setAttributeNS(W,'w:'+a,'Times New Roman'));pr.appendChild(f);
  if(color){const c=doc.createElementNS(W,'w:color');c.setAttributeNS(W,'w:val',color);pr.appendChild(c)}
  ['sz','szCs'].forEach(n=>{const e=doc.createElementNS(W,'w:'+n);e.setAttributeNS(W,'w:val',String(sz));pr.appendChild(e)});
  r.appendChild(pr);const t=doc.createElementNS(W,'w:t');t.setAttributeNS(XS,'xml:space','preserve');t.textContent=text;r.appendChild(t);p.appendChild(r)};
 put(rows[0].getElementsByTagNameNS(W,'tc')[0],MN[m]+' '+y,20,'000000');
 for(let d=1;d<=31;d++){const row=rows[d];if(d>N){row.remove();continue}
  const tcs=row.getElementsByTagNameNS(W,'tc'),dt=new Date(y,m,d),es=data[keyFor(dt)]||[];
  put(tcs[0],' '+d+'    '+GG[dt.getDay()]+'  ',20,dt.getDay()===0?'ff0000':'000000');
  let ore=0,perm=0,fer=false;const cl=[],nt=[];
  es.forEach(e=>{if(e.type==='cantiere'){ore+=num(e.oreLavoro);if(e.cliente)cl.push(e.cliente);if(e.note)nt.push(String(e.note).replace(/\s*\n\s*/g,'; '));if(num(e.oreViaggio))nt.push('viaggio '+fmt(num(e.oreViaggio))+'h')}else if(e.type==='permesso')perm+=num(e.orePermesso);else if(e.type==='ferie')fer=true;else if(e.type==='malattia')nt.push('Malattia')});
  const ord=Math.min(ore,8),st=Math.max(ore-8,0);
  put(tcs[1],cl.join(' / '),22);put(tcs[2],ord?fmt(ord):'',22);put(tcs[3],st?fmt(st):'',22);put(tcs[4],perm?fmt(perm):'',22);put(tcs[5],fer?'X':'',22);put(tcs[6],nt.join(' - '),18)}
 zip.file('word/document.xml',new XMLSerializer().serializeToString(doc));
 return {filename:'Presenze_'+MN[m]+'_'+y+'.docx',data:await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'})}}
async function exportMese(){try{await sendFile(await buildMese(cur.getFullYear(),cur.getMonth()))}catch(x){alert('Errore esportazione: '+x.message)}}

/* ---- salvataggio automatico (db) + JSON ---- */
let col=null,synced={},tmr=null;
const cl=t=>{const e=$('cloud');if(e)e.textContent=t};
const daysJson=()=>{const o={};for(const k in data)if(data[k]&&data[k].length)o[k]=JSON.stringify(data[k]);return o};
async function pushDb(){if(!col)return;const now=daysJson();try{
 for(const k in now)if(synced[k]!==now[k]){await col.doc(k).set({es:now[k]});synced[k]=now[k]}
 for(const k in synced)if(!(k in now)){await col.doc(k).delete();delete synced[k]}
 cl('☁️ Salvato automaticamente '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}))}catch(x){cl('⚠️ Salvataggio automatico non riuscito (resta il salvataggio locale)')}}
const baseSave=save;
save=()=>{baseSave();if(col){clearTimeout(tmr);tmr=setTimeout(pushDb,700)}};
(async()=>{try{const db=await claude.use('db'),u=await claude.use('user');if(!db||!u){cl('💾 Dati salvati sul telefono · copia di sicurezza: Salva JSON');return}
 const id=await u.id();if(!id){cl('💾 Dati salvati sul telefono · copia di sicurezza: Salva JSON');return}
 const c=db.collection('data/users/'+id),snap=await c.get();
 snap.docs.forEach(d=>{const v=d.data();if(v&&v.es){try{data[d.id]=JSON.parse(v.es);synced[d.id]=v.es}catch(x){}}});
 col=c;render();renderList&&renderList();baseSave();await pushDb()}catch(x){cl('💾 Dati salvati sul telefono · copia di sicurezza: Salva JSON')}})();
async function saveJson(){const o={filename:'agenda_'+keyFor(new Date())+'.json',data:new TextEncoder().encode(JSON.stringify({v:2,agenda:data},null,1))};
 const f=new File([o.data],o.filename,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:o.filename});return}}catch(x){if(x&&x.name==='AbortError')return}
 try{const dl=await claude.use('downloads');if(dl){await dl.save(o);return}}catch(x){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data],{type:'application/json'}));a.download=o.filename;document.body.appendChild(a);a.click();a.remove()}
$('jsBtn').onclick=saveJson;
$('jlBtn').onclick=()=>$('jf').click();
$('jf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text()),n=j.agenda||j;if(typeof n!=='object'||Array.isArray(n))throw 0;
 if(!confirm('Caricare il file? Le voci dello stesso giorno vengono sostituite.'))return;
 for(const k in n)if(Array.isArray(n[k]))data[k]=n[k];save();render();renderList&&renderList();cl('📂 Dati caricati da JSON')}catch(x){alert('File JSON non valido')}};
$('xlsBtn').onclick=exportMese;
render();
